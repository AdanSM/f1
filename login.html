<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesion</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="shortcut icon" href="/img/icones-d-administration-rouge.png" type="image/x-icon">
    <script src="/js/login.js" defer></script>
    
</head>
<body>

<form id="authForm">
    <div class="form-titulo">
        <img class="form-img" src="/img/f1-logo.png" alt="Logo F1">
        <h2 class="h2" id="formTitle">Inicio de sesion</h2>
    </div>

    <fieldset>
        <legend id="legendTitle">Información de Registro</legend>
        
        <div class="form"> 
            <label for="Nombre">Nombre
                <input class="input" type="text" placeholder="Nombre" id="Nombre" required>
            </label>
        </div>
        
        <div class="form">
            <label for="password">Contraseña
                <input class="input" type="password" placeholder="Tu Contraseña" id="password" required>
            </label>
        </div>
    </fieldset>
    
    <div class="btn-sign-in"> 
        <button type="submit" class="btn-login" id="submitBtn">Iniciar</button>
    </div>

    <div class="toggle-container" style="text-align: center; margin-top: 15px;">
        <a href="/register.html" id="toggleAuthMode" class="btn-secondary-login">
            Regístrate
        </a>
    </div>
</form>

</body>
</html>
